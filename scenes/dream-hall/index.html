<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#080f2b">
  <title>梅子雨的梦 · 梦境章节</title>
  <link rel="icon" href="./assets/star.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./style.css?v=gate-confirm40">
  <script type="importmap">{"imports":{"three":"./vendor/three.module.js","three/addons/":"./vendor/addons/"}}</script>
  <script type="module" src="./main.js?v=gate-confirm40"></script>
</head>
<body>
  <canvas id="world" tabindex="0" aria-label="可交互的向上拱廊与八扇门星空大厅"></canvas>
  <div class="vignette" aria-hidden="true"></div>
  <header class="masthead">
    <a class="wordmark" href="./" aria-label="回到梦的序章"><span class="brand-star">✦</span><span><span id="dream-name">梅子雨的梦</span><small>DREAM CHAPTERS</small></span></a>
    <button id="pause" class="quiet-button" hidden>暂停漫游 <span>Ⅱ</span></button>
  </header>
  <section id="welcome" class="welcome" aria-labelledby="welcome-title">
    <p class="eyebrow">序章 · 入梦</p>
    <h1 id="welcome-title">循着微光，<br>走进第一章。</h1>
    <p class="welcome-copy">沿着悬浮回廊，翻开梦的下一章。</p>
    <button id="enter" class="enter-button" disabled><span id="enter-label">星光正在抵达</span><span aria-hidden="true">↗</span></button>
    <p class="welcome-controls">WASD / 方向键移动 · 鼠标环视</p>
  </section>
  <div id="reticle" class="reticle" aria-hidden="true"></div>
  <div id="door-hint" class="door-hint" hidden><span class="door-hint-index"></span><h2></h2><p>这一章，尚未开启</p><button id="open-work" type="button" hidden>进入作品</button></div>
  <dialog id="gate-confirm" class="gate-confirm" aria-labelledby="gate-confirm-question">
    <p id="gate-confirm-question"></p>
    <div class="gate-confirm-actions">
      <button id="gate-confirm-yes" type="button" aria-label="确认进入"><span aria-hidden="true">✓</span><small>进入</small></button>
      <button id="gate-confirm-no" type="button" aria-label="取消进入"><span aria-hidden="true">✕</span><small>取消</small></button>
    </div>
  </dialog>
  <aside id="movement" class="movement" aria-label="移动方向摇杆">
    <div class="joystick" id="joystick" role="group" aria-label="拖动摇杆移动，也可以使用 WASD 或方向键">
      <span class="pad-arrow north">⌃</span><span class="pad-arrow east">›</span><span class="pad-arrow south">⌄</span><span class="pad-arrow west">‹</span>
      <span class="joystick-knob" id="joystick-knob"></span>
    </div>
    <span class="pad-caption">移动 / MOVE</span>
  </aside>
  <footer class="scene-footer"><span id="place-name">第一章 <i></i> 悬浮回廊</span><span id="control-hint">拖动鼠标环视 · WASD / 方向键移动</span><span class="floor-progress"><b id="altitude">00</b><span> / 64</span></span></footer>
  <p id="notice" class="notice" role="status" aria-live="polite"></p>
  <section id="unsupported" class="unsupported" hidden><h1>暂时无法点亮星空</h1><p>请使用支持 WebGL 2 的浏览器，并开启硬件加速。</p><p id="error-message"></p></section>
</body>
</html>
