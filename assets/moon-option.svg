<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
<defs>
  <radialGradient id="silver" cx=".35" cy=".3"><stop stop-color="#f2f4f7"/><stop offset=".65" stop-color="#d3dbe5"/><stop offset="1" stop-color="#8f9dae"/></radialGradient>
  <filter id="print" x="-12%" y="-12%" width="124%" height="124%">
    <feTurbulence type="fractalNoise" baseFrequency=".36" numOctaves="3" seed="11" result="grain"/>
    <feColorMatrix in="grain" type="saturate" values="0" result="gray"/>
    <feComposite in="gray" in2="SourceAlpha" operator="in" result="texture"/>
    <feBlend in="SourceGraphic" in2="texture" mode="soft-light" result="ink"/>
    <feGaussianBlur in="ink" stdDeviation=".35"/>
  </filter>
</defs>
<defs><mask id="crescent"><circle cx="100" cy="100" r="45" fill="#fff"/><circle cx="118" cy="87" r="43" fill="#000"/></mask></defs>
<circle cx="100" cy="100" r="45" fill="url(#silver)" mask="url(#crescent)" filter="url(#print)"/>
</svg>
