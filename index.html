<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#333333">
  <meta name="description" content="关于想象力的一切。Tread softly because you tread on my dreams.">
  <title>关于想象力的一切</title>
  <link rel="preload" href="./assets/hero-orbit.png" as="image">
  <link rel="preload" href="./assets/cormorant-garamond-400.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="stylesheet" href="./style.css">
  <link rel="stylesheet" href="./journey.css">
  <script src="./settings.js" defer></script>
  <script src="./app.js" defer></script>
  <script src="./journey.js" defer></script>
</head>
<body>
  <main class="scene" aria-labelledby="title">
    <img class="moon-image" src="./assets/hero-orbit.png" alt="" draggable="false">
    <canvas class="meteors" aria-hidden="true"></canvas>
    <div class="words">
      <p id="title" class="chinese">关于想象力的一切</p>
      <h1 class="english" lang="en">Tread softly because you tread<br>on my dreams.</h1>
    </div>
    <button class="enter-scene" type="button" aria-label="进入日月选择"></button>
  </main>
  <section class="choice-scene" aria-labelledby="choice-title" hidden>
    <h2 id="choice-title" class="sr-only">选择浏览方式</h2>
    <div class="ritual-stage">
      <img class="phase-arc" src="./assets/phase-arc.svg" alt="" draggable="false">
      <div class="mode-options">
        <button class="mode-option" data-mode="quick" type="button" disabled>
          <span class="choice-label">快速浏览</span>
        </button>
        <button class="mode-option" data-mode="showcase" type="button" disabled>
          <span class="choice-label">观赏模式</span>
        </button>
      </div>
    </div>
  </section>
  <main class="quick-view" aria-label="快速浏览" hidden>
    <header class="quick-header">
      <nav class="section-tabs" role="tablist" aria-label="内容分区">
        <button id="tab-intro" class="section-tab" type="button" role="tab" data-section="intro" aria-controls="panel-intro" aria-selected="true">个人介绍</button>
        <button id="tab-visual" class="section-tab" type="button" role="tab" data-section="visual" aria-controls="panel-visual" aria-selected="false" tabindex="-1">图像影视</button>
        <button id="tab-games" class="section-tab" type="button" role="tab" data-section="games" aria-controls="panel-games" aria-selected="false" tabindex="-1">游戏</button>
      </nav>
    </header>
    <section id="panel-intro" class="quick-panel" role="tabpanel" aria-labelledby="tab-intro" tabindex="0"><h2>个人介绍</h2></section>
    <section id="panel-visual" class="quick-panel" role="tabpanel" aria-labelledby="tab-visual" tabindex="0" hidden><h2>图像影视</h2></section>
    <section id="panel-games" class="quick-panel" role="tabpanel" aria-labelledby="tab-games" tabindex="0" hidden><h2>游戏</h2></section>
  </main>
  <button class="language-star" type="button" aria-label="Switch to English" title="English">
    <svg viewBox="0 0 100 140" aria-hidden="true">
      <path d="M50 2 55 53Q56 63 65 65L98 70 65 75Q56 77 55 87L50 138 45 87Q44 77 35 75L2 70 35 65Q44 63 45 53Z" fill="currentColor"/>
      <path d="M50 59Q54 65 61 70 54 75 50 81 46 75 39 70 46 65 50 59Z" fill="var(--star-center)"/>
      <path d="m50 67 2 3-2 3-2-3Z" fill="currentColor"/>
    </svg>
  </button>
  <div class="screen-fade" aria-hidden="true" hidden></div>
  <p class="journey-status sr-only" role="status" aria-live="polite"></p>
</body>
</html>
